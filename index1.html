<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錦英苑巴士看板 - 含 NA40</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard-container {
      width: 100vw;
      height: 75vw;
      max-height: 100vh;
      max-width: 133.33vh;
      aspect-ratio: 4 / 3;
      padding: 2.5vh;
      display: grid;
      grid-template-rows: 22% 1fr;
      gap: 2vh;
      background-color: #000;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2vw;
    }

    .card {
      background-color: #1c1c1e;
      border-radius: 1.5vh;
      padding: 2vh 2.5vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .time { font-size: 8vh; font-weight: 700; line-height: 1; letter-spacing: -2px; }
    .date { font-size: 2.3vh; color: #8e8e93; margin-top: 0.8vh; }
    .title { font-size: 2vh; color: #8e8e93; text-transform: uppercase; margin-bottom: 0.5vh; }
    .temp-val { font-size: 6.5vh; font-weight: 600; color: #30d158; line-height: 1; }

    .bus-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 1.8vh;
    }

    .bus-card {
      background-color: #1c1c1e;
      border-radius: 1.5vh;
      padding: 1.8vh 1.8vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .bus-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid #2c2c2e;
      padding-bottom: 1vh;
    }

    .bus-route { font-size: 4vh; font-weight: 800; color: #ff9f0a; line-height: 1; }
    .bus-dest { font-size: 1.8vh; color: #8e8e93; }

    .stop-list { display: flex; flex-direction: column; gap: 1vh; }
    .stop-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2c2c2e;
      padding: 1vh 1.2vw;
      border-radius: 1vh;
    }

    .stop-name { font-size: 2vh; font-weight: 600; }
    .stop-tag { font-size: 1.6vh; color: #ff9f0a; margin-right: 0.4vw; }
    .eta-val { font-size: 2.2vh; font-weight: 700; color: #64d2ff; }
    .eta-now { color: #ff9f0a; animation: blink 1s infinite; }

    @keyframes blink {
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="top-bar">
      <div class="card">
        <div class="time" id="clock">00:00:00</div>
        <div class="date" id="date">----年--月--日</div>
      </div>
      <div class="card">
        <div class="title">天文台即時氣溫</div>
        <div class="temp-val" id="weather">--°C</div>
      </div>
    </div>

    <div class="bus-grid" id="bus-grid">
      <div style="color: #8e8e93; grid-column: span 3; text-align: center; font-size: 2.5vh;">
        載入即時班次中...
      </div>
    </div>
  </div>

  <script>
    // 1. 時鐘與日期
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
      document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 天氣 API
    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        const temp = data.temperature.data.find(d => d.place === '香港天文台')?.value || data.temperature.data[0].value;
        document.getElementById('weather').innerText = `${temp}°C`;
      } catch (e) {
        document.getElementById('weather').innerText = '--°C';
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    // 3. 路線與車站設定 (共 6 條路線，剛好填滿 3x2 網格)
    const BUS_CONFIG = [
      { route: '87D', dest: '往 紅磡站' },
      { route: '87C', dest: '往 維港灣' },
      { route: '85M', dest: '往 黃大仙' },
      { route: '86K', dest: '往 沙田站' },
      { route: '86S', dest: '往 沙田站' },
      { route: 'NA40', dest: '往 機場/港珠澳口岸' }
    ];

    // 車站代碼清單 (含 NA40 的專屬新港城站位)
    const STOP_IDS = {
      kamYing: '325492BC6A8A41E1',      // 錦英苑 (總站)
      sunSunshine: 'A9FBDDAFFACD3A3B',  // 新港城 (一般路線)
      sunSunshineNa: 'B64D9280E102F47D' // 新港城 (NA40 機場線專屬站)
    };

    function parseMinutes(etaStr) {
      if (!etaStr) return null;
      const match = etaStr.match(/T(\d{2}):(\d{2}):(\d{2})/);
      if (!match) return null;

      const [_, h, m, s] = match.map(Number);
      const now = new Date();
      const etaSec = h * 3600 + m * 60 + s;
      const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

      let diffSec = etaSec - nowSec;
      if (diffSec < -43200) diffSec += 86400; // 跨夜時間處理

      return Math.round(diffSec / 60);
    }

    async function fetchStopEtaWithProxy(stopId) {
      const targetUrl = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

      try {
        let res = await fetch(proxyUrl);
        if (res.ok) {
          const json = await res.json();
          if (json.data) return json.data;
        }

        res = await fetch(targetUrl);
        if (res.ok) {
          const json = await res.json();
          if (json.data) return json.data;
        }
      } catch (err) {
        console.warn('Fetch error:', err);
      }
      return [];
    }

    async function refreshDashboard() {
      // 同時抓取錦英苑及新港城（含 NA40 專屬站位）的 API 資料
      const [kamYingData, sunshineData, sunshineNaData] = await Promise.all([
        fetchStopEtaWithProxy(STOP_IDS.kamYing),
        fetchStopEtaWithProxy(STOP_IDS.sunSunshine),
        fetchStopEtaWithProxy(STOP_IDS.sunSunshineNa)
      ]);

      const grid = document.getElementById('bus-grid');

      grid.innerHTML = BUS_CONFIG.map(bus => {
        // 1. 處理「站 1：錦英苑 (總站)」
        const kamYingMatches = kamYingData.filter(item => item && item.route === bus.route && item.eta);
        
        // 2. 處理「站 2：新港城」(NA40 抓專屬站位，其餘路線抓一般站位)
        const targetSunshineData = (bus.route === 'NA40') ? sunshineNaData : sunshineData;
        const sunshineMatches = targetSunshineData.filter(item => item && item.route === bus.route && item.eta);

        function formatEta(matches) {
          if (matches.length === 0) return '未有班次';
          const minsList = matches
            .map(m => parseMinutes(m.eta))
            .filter(m => m !== null && m >= -2)
            .sort((a, b) => a - b);

          if (minsList.length === 0) return '未有班次';
          const nextMin = minsList[0];
          if (nextMin <= 0) return '<span class="eta-now">即將開出</span>';
          return `${nextMin} 分鐘`;
        }

        return `
          <div class="bus-card">
            <div class="bus-header">
              <div class="bus-route">${bus.route}</div>
              <div class="bus-dest">${bus.dest}</div>
            </div>
            <div class="stop-list">
              <div class="stop-row">
                <div>
                  <span class="stop-tag">站 1</span>
                  <span class="stop-name">錦英苑 (總站)</span>
                </div>
                <div class="eta-val">${formatEta(kamYingMatches)}</div>
              </div>
              <div class="stop-row">
                <div>
                  <span class="stop-tag">站 2</span>
                  <span class="stop-name">新港城</span>
                </div>
                <div class="eta-val">${formatEta(sunshineMatches)}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    refreshDashboard();
    setInterval(refreshDashboard, 20000); // 20 秒自動更新
  </script>
</body>
</html>
